name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night, to see changes on the demo shop (prices, HTML, downtime).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which tag to run
        type: choice
        options: [all, '@smoke', '@regression']
        default: all

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright image with the browsers installed. Keep the version the same as package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: true
      # Firefox does not start in the container if HOME is not /root.
      HOME: /root
    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - run: npm run typecheck

      - name: Run tests
        run: |
          if [ "${SUITE:-all}" = "all" ]; then
            npx playwright test
          else
            npx playwright test --grep "$SUITE"
          fi
        env:
          SUITE: ${{ inputs.suite }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
